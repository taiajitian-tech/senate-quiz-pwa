<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>語想起トレーニング</title><style>body{font:17px system-ui;background:#f3f5f7;color:#17232d;max-width:560px;margin:auto;padding:20px}section{background:white;border-radius:16px;padding:20px;margin:12px 0}button,input,select{font:inherit;padding:12px;border:1px solid #ccd3da;border-radius:10px;margin:5px 0;box-sizing:border-box}button{background:#fff;width:100%;cursor:pointer}button.primary{background:#173e59;color:white}input,select{width:100%}img{max-height:210px;max-width:100%;display:block;margin:auto}small{color:#52616b}h2{font-size:21px}</style><h1>語想起トレーニング</h1><main id="app"></main><script>
const $=id=>document.getElementById(id), app=$('app'), key='recall-private-v1', read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}, save=(k,v)=>localStorage.setItem(k,JSON.stringify(v)), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let people=read(key+'people',[]), logs=read(key+'logs',[]), pool=[], queue=[], cur, hint=0, started=0, retry=false, medication='記録なし', total=0, done=0, revealed=false, recalled=false;
const words=[['時間を確認する腕につける道具','腕時計','うでどけい'],['雨の日に差すもの','傘','かさ'],['紙を切る道具','はさみ','はさみ'],['歯を磨く道具','歯ブラシ','はぶらし'],['衣服のしわを伸ばす道具','アイロン','あいろん'],['遠くのものを拡大して見る道具','双眼鏡','そうがんきょう'],['温度を測る道具','温度計','おんどけい'],['靴を履くときに使う道具','靴べら','くつべら'],['書類を留める道具','ホチキス','ほちきす'],['料理をすくう道具','おたま','おたま'],['床のごみを集める道具','ほうき','ほうき'],['瓶の栓を抜く道具','栓抜き','せんぬき']].map((a,i)=>({id:'w'+i,prompt:a[0],name:a[1],kana:a[2],type:'一般単語'}));
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
async function load(){let results=await Promise.allSettled(['senators','representatives','ministers'].map(async t=>{let r=await fetch('data/'+t+'.json');if(!r.ok)throw Error(t);return (await r.json()).map(p=>({id:t+p.id,name:p.name.split(/[（(]/)[0].trim(),kana:(p.kana||p.name.match(/[（(]([^）)]+)/)?.[1]||'').replace(/\s/g,''),image:p.images?.[0]||p.image,info:[p.party,p.district,p.role||p.group].filter(Boolean).join(' / '),type:'議員',target:t}))}));pool=results.flatMap(r=>r.status==='fulfilled'?r.value:[]);home()}
function home(){app.innerHTML='<section><h2>今日のトレーニング</h2><p>約10〜15分・6種類の課題</p><small>議員データ '+pool.length+'件 ／ 身近な人 '+people.length+'件</small><label>服薬状況（任意）<select id="med"><option>記録なし</option><option>服用後</option><option>服用前</option></select></label><label>議員の対象<select id="target"><option value="senators">参議院</option><option value="representatives">衆議院</option><option value="ministers">大臣</option><option value="all">全員</option></select></label><button class="primary" onclick="start()">開始</button><button onclick="register()">身近な人を登録</button><button onclick="stats()">学習記録</button></section><small>自主練習用です。治療効果は確立されていません。服薬を変更する必要はありません。</small>'}
function register(){app.innerHTML='<section><h2>身近な人の登録</h2><input id="nm" placeholder="名前"><input id="kn" placeholder="読み（ひらがな）"><input id="pr" placeholder="人物の特徴・関係"><input id="ct" placeholder="会話の状況（任意）"><button onclick="add()">保存</button>'+people.map((p,i)=>'<p>'+esc(p.name)+' <button onclick="remove('+i+')">削除</button></p>').join('')+'<button onclick="home()">戻る</button><small>このブラウザ内に保存します。</small></section>'}
function add(){if(!$('nm').value.trim()||!$('kn').value.trim()||!$('pr').value.trim())return alert('名前・読み・特徴を入力してください');people.push({id:'p'+Date.now(),name:$('nm').value,kana:$('kn').value,prompt:$('pr').value,context:$('ct').value,type:'身近な人'});save(key+'people',people);register()}function remove(i){if(confirm('削除しますか？')){people.splice(i,1);save(key+'people',people);register()}}
function choose(a,n){let now=Date.now();return shuffle(a).sort((a,b)=>priority(b,now)-priority(a,now)).slice(0,n)}function priority(p,now){let l=logs.filter(x=>x.id===p.id).at(-1);return !l?2:l.due<=now?4:0}
function start(){medication=$('med').value;let t=$('target').value;queue=[...choose(words,5),...choose(pool.filter(p=>t==='all'||p.target===t),10),...choose(people,4),{type:'分類想起',prompt:'海の動物、農場の動物、ペットを順番に思い出す',id:'category'},{type:'自由想起',prompt:shuffle(['食べ物','動物','地名','日用品'])[0]+'を自由に思い出す',id:'free'},...choose(people,3).map(p=>({...p,type:'会話形式',prompt:p.context||p.prompt})),...(!people.length?[{...words[0],type:'会話形式',prompt:'今何時か確認したい。腕につけるものは？'}]:[])];total=queue.length;done=0;next()}
function next(){cur=queue.shift();if(!cur){stats(true);return}hint=0;revealed=false;recalled=false;started=Date.now();render()}
function render(){let free=!cur.name;app.innerHTML='<small>'+done+'問終了 ／ 残り '+(queue.length+1)+'問</small><section><h2>'+esc(cur.type)+'</h2>'+(cur.image?'<img src="'+esc(cur.image)+'" alt="議員の顔写真">':'<p>'+esc(cur.prompt)+'</p>')+(free?'<p>60秒間、声に出して答えてください。重複を除いた個数を記録します。</p><button onclick="timer()">60秒開始</button><p id="clock"></p><input id="count" type="number" min="0" placeholder="思い出せた個数"><button onclick="finishFree()">記録して次へ</button>':'<p id="cue">'+(revealed?esc(cur.name)+'（'+esc(cur.kana)+'）<br>'+esc(cur.info||''):hint?esc(cur.kana.slice(0,hint))+'…':'声に出して名前を答えてください')+'</p>'+(revealed?(recalled?'<button class="primary" onclick="finish(true)">合っていた・次へ</button><button onclick="finish(false)">間違っていた・次へ</button>':'<button onclick="finish(false)">思い出せなかった・次へ</button>'):'<button class="primary" onclick="confirmRecall()">思い出せた</button><button onclick="more()">頭文字ヒント</button><button onclick="reveal()">正解を見る</button>'))+'<button onclick="home()">終了</button></section>'}
function more(){if(!cur.kana||hint>=cur.kana.length-1){reveal();return}hint++;render()}function confirmRecall(){recalled=true;revealed=true;render()}function reveal(){recalled=false;revealed=true;render()}
function finish(ok){let prev=logs.filter(l=>l.id===cur.id).at(-1), streak=ok&&!hint?Math.min(3,(prev?.streak||0)+1):0;logs.push({id:cur.id,type:cur.type,ok,hint,seconds:Math.round((Date.now()-started)/1000),date:Date.now(),medication,streak,due:Date.now()+[0,1,3,7][streak]*86400000});save(key+'logs',logs);if((!ok||hint)&&!cur.repeated){queue.splice(Math.min(3,queue.length),0,{...cur,repeated:true})}done++;next()}
let interval;function timer(){clearInterval(interval);let end=Date.now()+60000;interval=setInterval(()=>{let el=$('clock');if(!el){clearInterval(interval);return}let n=Math.max(0,Math.ceil((end-Date.now())/1000));el.textContent=n+'秒';if(!n)clearInterval(interval)},200)}function finishFree(){let v=$('count').value;if(v===''||Number(v)<0)return;clearInterval(interval);logs.push({id:cur.id,type:cur.type,count:Number(v),date:Date.now(),medication});save(key+'logs',logs);done++;next()}
function stats(end=false){let a=logs.filter(x=>typeof x.ok==='boolean'), groups=['記録なし','服用前','服用後'];app.innerHTML='<section><h2>'+(end?'今日の練習終了':'学習記録')+'</h2><p>累計 '+a.length+'問 ／ ヒントなし正答率 '+(a.length?Math.round(100*a.filter(x=>x.ok&&!x.hint).length/a.length):0)+'%</p>'+groups.map(g=>{let b=a.filter(x=>x.medication===g);return '<p>'+g+'：'+b.length+'問 '+(b.length?Math.round(100*b.filter(x=>x.ok&&!x.hint).length/b.length)+'%':'—')+'</p>'}).join('')+'<h3>最近の自由・分類想起</h3>'+logs.filter(x=>x.count!==undefined).slice(-10).reverse().map(x=>'<p>'+new Date(x.date).toLocaleDateString('ja-JP')+' '+esc(x.type)+' '+x.count+'個</p>').join('')+'<button onclick="home()">ホーム</button><small>自己採点です。服薬状況による差は薬の効果を証明するものではありません。</small></section>'}
home();load();
</script></html>
