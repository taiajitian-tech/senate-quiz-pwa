name: update-notices

on:
  push:
    branches: ["main"]
    paths:
      - "web/public/data/senators.json"
      - "web/public/data/representatives.json"
      - "web/public/data/ministers.json"
      - "web/public/data/vice-ministers.json"
      - "web/public/data/parliamentary-secretaries.json"
      - "web/public/data/councilors-officers.json"
      - "web/public/data/house-officers.json"
      - "web/public/data/manual-notices.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-generated-data
  cancel-in-progress: false

jobs:
  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate notices from the last published data
        working-directory: web
        run: node scripts/generateUpdates.mjs
      - name: Commit notices
        run: |
          set -euo pipefail
          if git diff --quiet -- web/public/data/updates.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/updates.json
          git commit -m "chore: publish automatic data change notices"
          git push
      - name: Publish notices
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
